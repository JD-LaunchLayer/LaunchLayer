# Render Markdown posts whose frontmatter date has arrived,
# inject listing cards, stamp draft: false, and commit the HTML on main.
# Dual Europe/London slots avoid GitHub's contested :00 UTC window (scheduled
# workflows can be delayed or dropped under load — see GitHub docs:
# "Events that trigger workflows" → schedule). Cursor/`gh workflow run` as
# the GitHub App integration cannot dispatch this workflow (403 Resource
# not accessible by integration); humans use the Actions UI or a PAT with
# `workflow` scope.
name: Publish scheduled blog posts

on:
  schedule:
    # Avoid :00 UTC contention. ~09:17 UK.
    - cron: "17 9 * * *"
      timezone: Europe/London
    # Same-day catch-up if morning dropped. ~18:23 UK.
    - cron: "23 18 * * *"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder
        # Pillow>=11.3 wheels include AVIF; needed by make-display-derivatives.py.
        run: pip install markdown "Pillow>=11.3.0"
      - name: Build posts due today
        run: python3 scripts/build-blog.py
      - name: Guard post chrome and listing cards
        # post chrome = fonts + design-tokens; listing = h2 from listing_card()
        run: |
          python3 scripts/build-blog.py --self-test
          python3 scripts/build-blog.py --check
      # Listing <picture> sources are /assets/images/thumbs/{stem}-w800.{avif,webp}.
      # build-blog.py injects those URLs but does not encode the files. Run
      # derivatives before commit so new posts do not ship 404 thumbs (16 Sep SSD).
      - name: Build display derivatives
        run: python3 scripts/make-display-derivatives.py
      - name: Commit published pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog content assets/images/thumbs
          if git diff --staged --quiet; then
            echo "No scheduled posts were due."
            exit 0
          fi
          git commit -m "Publish Markdown blog posts due on $(date -u +%F)."
          git push
