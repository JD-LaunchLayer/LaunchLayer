# The site is static. Publish _publish, which scripts/assemble-publish.py
# fills from tracked files and leaves docs/ out. Without this, Netlify
# serves the repository root and /docs/ would be public.
[build]
  command = "python3 scripts/assemble-publish.py"
  publish = "_publish"

# Internal measurement notes. Not a public URL. force so a file in the
# publish directory cannot override this.
[[redirects]]
  from = "/docs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# www → apex + trailing slash in one 301. The function returns that 301
# and ends the chain, so the domain-level www→apex hop cannot emit a
# no-slash first Location (#88 was 2 hops). Apex is a no-op inside the
# function: Pretty URLs still own /path → /path/.
#
# Do not use path = "/*". That runs Deno before every static file. When
# the runtime fails, www returns 500 ("Error - Request ID") and an apex
# cache miss comes back as an empty 503 (fwd-status=503). excludedPath
# did not stop those requests on this site. Every public page path is
# extension-less; CSS, fonts, and images contain a dot, so this pattern
# never matches them. The domain-level www→apex redirect still preserves
# asset paths in one hop.
[[edge_functions]]
  function = "www-apex-slash"
  pattern = "^/[^.]*$"

# Serverless functions (contact form / Turnstile) sit beside edge functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# No Referrer-Policy was set in this file or in a _headers file.
# Cross-origin requests send only the origin, so a query string is not
# passed to Maps, Umami, or other sites. Same-origin requests still send the path.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
