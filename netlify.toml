# Edge Functions run before _redirects. Returning a 301 ends the
# request chain so Netlify's domain-level www→apex hop cannot emit
# a no-slash first Location (that is why #88 still 2-hops live).

[[edge_functions]]
function = "www-apex-slash"
path = "/*"

# Serverless functions (contact form / Turnstile) sit beside edge functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
